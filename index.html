<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portofolio Data</title>
  <meta name="description" content="Portofolio Python, Data Analysis, dan Machine Learning">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="nav">
    <a href="#top" class="brand" id="brand">Portofolio</a>
    <nav>
      <a href="#tentang">Tentang</a>
      <a href="#proyek">Proyek</a>
      <a href="#kontak">Kontak</a>
    </nav>
  </header>

  <main id="top">
    <!-- HERO -->
    <section class="hero">
      <p class="eyebrow" id="role"></p>
      <h1 id="name"></h1>
      <p class="tagline" id="tagline"></p>
      <div class="hero-links" id="heroLinks"></div>
    </section>

    <!-- TENTANG -->
    <section id="tentang" class="section">
      <h2>Tentang Saya</h2>
      <p id="about" class="about"></p>
      <div id="journey" class="journey"></div>
    </section>

    <!-- PROYEK -->
    <section id="proyek" class="section">
      <h2>Proyek &amp; Hasil Belajar</h2>
      <div id="tabs" class="tabs" role="tablist"></div>
      <div id="modules"></div>
    </section>

    <!-- KONTAK -->
    <section id="kontak" class="section">
      <h2>Kontak</h2>
      <p>Tertarik berdiskusi atau berkolaborasi? Hubungi saya lewat:</p>
      <div id="contacts" class="contacts"></div>
    </section>
  </main>

  <footer>
    <p id="footer"></p>
  </footer>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
